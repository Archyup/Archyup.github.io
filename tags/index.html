  // 6. 文章页左侧「文章导读 (TOC)」与高精度滚动定位引擎（解决滑到底部仍停留在上一节的问题）
  function setupArticleTOC() {
    const sidebar = document.querySelector("aside.sidebar");
    if (!sidebar) return;
    const tocWrap = sidebar.querySelector(".post-toc-wrap");
    const tocLinks = Array.from(sidebar.querySelectorAll(".post-toc a.nav-link"));
    if (!tocWrap || tocLinks.length === 0) {
      sidebar.style.display = "none";
      return;
    }

    document.body.classList.add("qy-has-toc");
    if (!tocWrap.querySelector(".qy-toc-header")) {
      const tocHeader = document.createElement("div");
      tocHeader.className = "qy-toc-header";
      tocHeader.innerHTML = '<i class="fa-solid fa-list-ul"></i><span>文章导读</span>';
      tocWrap.prepend(tocHeader);
    }

    // 建立目录链接与正文标题元素的精确映射，并接管 NexT 默认存在缺陷的 updateActiveNav
    if (window.NexT && window.NexT.utils) {
      window.NexT.utils.updateActiveNav = function() {};
      window.NexT.utils.activateNavByIndex = function() {};
    }

    const headingItems = tocLinks.map(link => {
      const href = link.getAttribute("href") || "";
      if (!href.startsWith("#")) return null;
      const rawId = decodeURIComponent(href.slice(1));
      const targetEl = document.getElementById(rawId) || document.getElementById(href.slice(1));
      const navItem = link.closest(".nav-item");
      const parentLevel2 = navItem ? navItem.closest(".nav-level-2") : null;
      return targetEl ? { link, navItem, parentLevel2, targetEl } : null;
    }).filter(Boolean);

    if (headingItems.length === 0) return;

    // 清除 NexT 内联写入的错误 --height 限制，防止多行子标题 (如 3.2, 3.3) 被截断隐藏
    sidebar.querySelectorAll(".nav-child").forEach(child => {
      child.style.removeProperty("--height");
      child.style.height = "auto";
    });

    let clickLockedIdx = -1;
    let clickLockTimer = null;

    function highlightTocIndex(activeIndex) {
      const activeEntry = headingItems[activeIndex];
      const activeParent = activeEntry ? activeEntry.parentLevel2 : null;

      sidebar.querySelectorAll(".nav-item").forEach(el => {
        el.classList.remove("active", "active-current", "qy-toc-current", "qy-toc-parent-active");
      });

      headingItems.forEach((item, idx) => {
        const isCurrent = (idx === activeIndex);
        item.link.classList.toggle("qy-toc-link-current", isCurrent);
        if (isCurrent && item.navItem) {
          item.navItem.classList.add("qy-toc-current", "active", "active-current");
        }
      });

      if (activeParent) {
        activeParent.classList.add("qy-toc-parent-active", "active");
      }

      // 确保当前高亮的目录项在左侧导读框可视区域内
      if (activeEntry && activeEntry.link && tocWrap) {
        const linkRect = activeEntry.link.getBoundingClientRect();
        const wrapRect = tocWrap.getBoundingClientRect();
        if (linkRect.top < wrapRect.top + 36 || linkRect.bottom > wrapRect.bottom - 24) {
          tocWrap.scrollTo({
            top: tocWrap.scrollTop + (linkRect.top - wrapRect.top) - wrapRect.height * 0.35,
            behavior: "smooth"
          });
        }
      }
    }

    // 6.1 物理级稳固吸顶锁 (Sticky + Fixed Pinning Engine)：
    // 无论浏览器是否因 overflow-x: hidden 禁用原生 sticky，下滑时均将导读框稳固锁定在屏幕左侧
    const colEl = sidebar.closest(".column") || sidebar.parentElement;
    function syncSidebarStickyPin() {
      if (window.innerWidth < 1024 || !colEl) {
        sidebar.style.position = "";
        sidebar.style.top = "";
        sidebar.style.left = "";
        sidebar.style.width = "";
        return;
      }
      const colRect = colEl.getBoundingClientRect();
      if (colRect.top <= 24) {
        sidebar.style.setProperty("position", "fixed", "important");
        sidebar.style.setProperty("top", "24px", "important");
        sidebar.style.setProperty("left", colRect.left + "px", "important");
        sidebar.style.setProperty("width", "250px", "important");
      } else {
        sidebar.style.setProperty("position", "relative", "important");
        sidebar.style.setProperty("top", "0px", "important");
        sidebar.style.setProperty("left", "0px", "important");
        sidebar.style.setProperty("width", "250px", "important");
      }
    }

    function updateTocOnScroll() {
      syncSidebarStickyPin();
      if (clickLockedIdx !== -1) {
        highlightTocIndex(clickLockedIdx);
        return;
      }

      const scrollY = window.scrollY || document.documentElement.scrollTop;
      const winH = window.innerHeight;
      const docH = document.documentElement.scrollHeight;

      // 当页面滚动到最底部时，精准激活最后一个目录项
      if (winH + scrollY >= docH - 45) {
        highlightTocIndex(headingItems.length - 1);
        return;
      }

      // 以屏幕上半区 (46% 处) 作为自然阅读视线基准线：新章节进入上半屏即刻展开对应大块下的小块
      const readingLine = Math.max(180, winH * 0.46);
      let activeIdx = 0;
      for (let i = 0; i < headingItems.length; i++) {
        const rect = headingItems[i].targetEl.getBoundingClientRect();
        if (rect.top <= readingLine) {
          activeIdx = i;
        } else {
          break;
        }
      }
      highlightTocIndex(activeIdx);
    }

    // 使用捕获阶段拦截目录点击，覆盖 NexT 默认滚动，精准对齐标题并高亮对应子章节
    headingItems.forEach((item, idx) => {
      item.link.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopImmediatePropagation();
        clickLockedIdx = idx;
        highlightTocIndex(idx);
        if (clickLockTimer) clearTimeout(clickLockTimer);
        const topPos = item.targetEl.getBoundingClientRect().top + window.scrollY - 64;
        window.scrollTo({ top: Math.max(0, topPos), behavior: "smooth" });
        history.replaceState(null, document.title, item.link.getAttribute("href"));
        clickLockTimer = setTimeout(() => {
          clickLockedIdx = -1;
          updateTocOnScroll();
        }, 750);
      }, true);
    });

    window.addEventListener("scroll", function() {
      window.requestAnimationFrame(updateTocOnScroll);
    }, { passive: true });
    window.addEventListener("resize", function() {
      window.requestAnimationFrame(syncSidebarStickyPin);
    }, { passive: true });
    updateTocOnScroll();
  }
  setupArticleTOC();

  // 8. 改造文章列表卡片：简洁「摘要」与「深读」按钮

  // 9. 实时壁纸抓取 + 后台预加载双缓冲引擎（每次切换均实时拉取新壁纸且0等待）
  let activeLayerIsA = true;
  let autoRotateTimer = null;
  let isAutoRotate = localStorage.getItem("qy_auto_wp") === "true";
  let isPaperMode = localStorage.getItem("qy_paper_mode") === "true";
  let nextPreloadedUrl = null;

  const layerA = bgContainer.querySelector(".qy-bg-a");
  const layerB = bgContainer.querySelector(".qy-bg-b");
  const btnAutoWp = document.getElementById("qy-dock-auto-wp");
  const btnPaperMode = document.getElementById("qy-dock-paper-mode");
  const wpIconEl = document.getElementById("qy-wp-icon");

  function preloadNextLiveWallpaper() {
    const candidateUrl = generateLiveWallpaperUrl();
    const img = new Image();
    img.onload = function() {
      nextPreloadedUrl = img.currentSrc || candidateUrl;
    };
    img.onerror = function() {
      // 若某个实时随机源偶发超时，自动回退到保底高清画卷池
      const fallback = SEED_WALLPAPERS[Math.floor(Math.random() * SEED_WALLPAPERS.length)];
      nextPreloadedUrl = fallback;
    };
    img.src = candidateUrl;
  }

  function crossfadeToUrl(url) {
    const targetLayer = activeLayerIsA ? layerA : layerB;
    const otherLayer = activeLayerIsA ? layerB : layerA;
    targetLayer.style.backgroundImage = `url("${url}")`;
    targetLayer.classList.add("active");
    otherLayer.classList.remove("active");
    activeLayerIsA = !activeLayerIsA;
    localStorage.setItem("qy_last_wp_url", url);
  }

  // 初始壁纸展示并立即在后台预抓取下一张实时新图
  const savedLastUrl = localStorage.getItem("qy_last_wp_url") || SEED_WALLPAPERS[0];
  layerA.style.backgroundImage = `url("${savedLastUrl}")`;
  activeLayerIsA = false;
  preloadNextLiveWallpaper();

  function nextWallpaper() {
    if (isPaperMode) togglePaperMode(false);
    if (nextPreloadedUrl) {
      const readyUrl = nextPreloadedUrl;
      nextPreloadedUrl = null;
      crossfadeToUrl(readyUrl);
      preloadNextLiveWallpaper();
      return;
    }
    if (isFetchingWp) return;
    isFetchingWp = true;
    if (wpIconEl) wpIconEl.classList.add("fa-spin");

    const liveUrl = generateLiveWallpaperUrl();
    const img = new Image();
    img.onload = function() {
      isFetchingWp = false;
      if (wpIconEl) wpIconEl.classList.remove("fa-spin");
      crossfadeToUrl(img.currentSrc || liveUrl);
      preloadNextLiveWallpaper();
    };
    img.onerror = function() {
      isFetchingWp = false;
      if (wpIconEl) wpIconEl.classList.remove("fa-spin");
      const fallback = SEED_WALLPAPERS[Math.floor(Math.random() * SEED_WALLPAPERS.length)];
      crossfadeToUrl(fallback);
      preloadNextLiveWallpaper();
    };
    img.src = liveUrl;
  }

  function updateAutoRotateState() {
    if (autoRotateTimer) clearInterval(autoRotateTimer);

      btnAutoWp.classList.remove("active");

  let modeTransitionLock = false;

    window.addEventListener("wheel", function(e) {
      if (e.target.closest(".qy-peek-drawer") || e.target.closest(".qy-search-dropdown")) return;
      const isZen = document.body.classList.contains("qy-portal-zen");
      if (isZen && e.deltaY > 12) {
        setPortalMode(false);
      } else if (!isZen && (window.scrollY || document.documentElement.scrollTop) <= 4 && e.deltaY < -18) {
        setPortalMode(true);
      }
    }, { passive: true });

    let touchStartY = 0;
    window.addEventListener("touchstart", function(e) {
      if (e.touches.length === 1) touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener("touchmove", function(e) {
      if (e.touches.length !== 1) return;
      const dy = touchStartY - e.touches[0].clientY;
      const isZen = document.body.classList.contains("qy-portal-zen");
      if (isZen && dy > 28) {
        setPortalMode(false);
      } else if (!isZen && (window.scrollY || document.documentElement.scrollTop) <= 4 && dy < -35) {
        setPortalMode(true);
      }
    }, { passive: true });
  }

  document.getElementById("qy-scroll-hint").addEventListener("click", function() {
    setPortalMode(false);
  });

  // 11. 监听滚动：下滑阅读时，控制坞平滑移至左下角并收缩为「归顶 ↑」单按钮
  let isScrollingToTop = false;
  function handleScroll() {
    if (isScrollingToTop) {
      if (window.scrollY <= 10) {
        isScrollingToTop = false;
        dock.classList.remove("qy-dock-scrolled");
      }
      return;
    }
    const scrollY = window.scrollY || document.documentElement.scrollTop;
    if (scrollY > 75 || (isHomePage && document.body.classList.contains("qy-portal-scroll") && scrollY > 30)) {
      dock.classList.add("qy-dock-scrolled");
    } else {
      dock.classList.remove("qy-dock-scrolled");
    }
  }
  window.addEventListener("scroll", handleScroll, { passive: true });
  handleScroll();

  // 12. 交互事件绑定
  const peekDrawer = document.getElementById("qy-peek-drawer");
  const quickPeekBtn = document.getElementById("qy-btn-quick-peek");

  // 支持从内页点击「新篇速览」自动切回首屏视界并直接展开速览抽屉
  const urlParams = new URLSearchParams(window.location.search);
  if (isHomePage && (urlParams.get("peek") === "1" || sessionStorage.getItem("qy_open_peek") === "1")) {
    sessionStorage.removeItem("qy_open_peek");
    if (urlParams.get("peek") === "1") {
      history.replaceState(null, document.title, "/");
    }
    setPortalMode(true);
    peekDrawer.classList.add("open");
    quickPeekBtn.classList.add("active");
  }

  quickPeekBtn.addEventListener("click", function() {
    if (!isHomePage) {
      sessionStorage.setItem("qy_open_peek", "1");
      window.location.href = "/?peek=1";
      return;
    }
    if (!document.body.classList.contains("qy-portal-zen")) {
      setPortalMode(true);
      peekDrawer.classList.add("open");
      this.classList.add("active");
      return;
    }
    peekDrawer.classList.toggle("open");
    this.classList.toggle("active", peekDrawer.classList.contains("open"));
  });

  document.getElementById("qy-peek-close").addEventListener("click", function() {
    peekDrawer.classList.remove("open");
    quickPeekBtn.classList.remove("active");
  });

  document.getElementById("qy-brand-home").addEventListener("click", function() {
    if (isHomePage) {
      setPortalMode(true);
    } else {
      window.location.href = "/";
    }
  });

  document.getElementById("qy-dock-portal").addEventListener("click", function() {
    if (!isHomePage) {
      window.location.href = "/";
      return;
    }
    const isCurrentlyZen = document.body.classList.contains("qy-portal-zen");
    setPortalMode(!isCurrentlyZen);
  });

  document.getElementById("qy-dock-articles").addEventListener("click", function() {
    if (!isHomePage) {
      window.location.href = "/archives/";
      return;
    }
    setPortalMode(false);
  });

  document.getElementById("qy-dock-next-wp").addEventListener("click", nextWallpaper);

  btnAutoWp.addEventListener("click", function() {
    isAutoRotate = !isAutoRotate;
    localStorage.setItem("qy_auto_wp", String(isAutoRotate));
    updateAutoRotateState();
  });

  btnPaperMode.addEventListener("click", function() {
    togglePaperMode();
  });

  document.getElementById("qy-dock-top").addEventListener("click", function() {
    isScrollingToTop = true;
    dock.classList.remove("qy-dock-scrolled");
    if (isHomePage) {
      setPortalMode(true);
    } else {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    setTimeout(() => { isScrollingToTop = false; }, 600);
  });

  // 13. 站内实时检索框逻辑（支持上下键选择与回车站内优先直达）
  const searchInput = document.getElementById("qy-search-input");
  const searchDropdown = document.getElementById("qy-search-dropdown");
  let currentMatches = [];
  let selectedIdx = -1;

  function updateActiveSearchItem() {
    const items = searchDropdown.querySelectorAll(".qy-search-item");
    items.forEach((item, idx) => {
      if (idx === selectedIdx) {
        item.classList.add("active");
        item.scrollIntoView({ block: "nearest", behavior: "smooth" });
      } else {
        item.classList.remove("active");
      }
    });
  }

  function performSearch() {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) {
      currentMatches = [];
      selectedIdx = -1;
      searchDropdown.innerHTML = "";
      searchDropdown.classList.remove("show");
      return;
    }

    currentMatches = POST_INDEX.filter(p =>
      (p.title && p.title.toLowerCase().includes(q)) ||
      (p.shortTitle && p.shortTitle.toLowerCase().includes(q)) ||
      (p.summary && p.summary.toLowerCase().includes(q)) ||
      (p.tags && p.tags.some(t => t.toLowerCase().includes(q))) ||
      (p.cat && p.cat.toLowerCase().includes(q))
    );

    selectedIdx = currentMatches.length > 0 ? 0 : -1;

    if (currentMatches.length > 0) {
      searchDropdown.innerHTML = currentMatches.map((m, idx) => `
        <a href="${m.url}" class="qy-search-item ${idx === 0 ? 'active' : ''}" data-idx="${idx}">
          <div class="qy-search-item-top">
            <span class="qy-search-item-cat">${m.cat}</span>
            <span class="qy-search-item-title">${m.shortTitle}</span>
            <span class="qy-search-item-date">${m.date}</span>
          </div>
          <div class="qy-search-item-desc">${m.summary}</div>
        </a>
      `).join("");

      // 绑定鼠标划入高亮事件
      searchDropdown.querySelectorAll(".qy-search-item").forEach(item => {
        item.addEventListener("mouseenter", function() {
          const idx = parseInt(this.getAttribute("data-idx"), 10);
          if (!isNaN(idx)) {
            selectedIdx = idx;
            updateActiveSearchItem();
          }
        });
      });
    } else {
      searchDropdown.innerHTML = `
        <div class="qy-search-empty">未在站内寻得匹配文卷</div>
        <a href="https://cn.bing.com/search?q=${encodeURIComponent(searchInput.value.trim())}" target="_blank" class="qy-search-external-hint" id="qy-search-ext-link">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> 尝试全网检索「${searchInput.value.trim()}」
        </a>
      `;
    }
    searchDropdown.classList.add("show");
  }

  searchInput.addEventListener("input", performSearch);
  searchInput.addEventListener("compositionend", performSearch);

  searchInput.addEventListener("keydown", function(e) {
    // 拦截中文/拼音输入法组字或英文选词确认过程中的回车与方向键
    if (e.isComposing || e.keyCode === 229) {
      return;
    }

    if (e.key === "ArrowDown") {
      if (currentMatches.length > 0) {
        e.preventDefault();
        selectedIdx = (selectedIdx + 1) % currentMatches.length;
        updateActiveSearchItem();
      } else {
        const extLink = document.getElementById("qy-search-ext-link");
        if (extLink) {
          extLink.classList.add("active");
        }
      }
    } else if (e.key === "ArrowUp") {
      if (currentMatches.length > 0) {
        e.preventDefault();
        selectedIdx = (selectedIdx - 1 + currentMatches.length) % currentMatches.length;
        updateActiveSearchItem();
      } else {
        const extLink = document.getElementById("qy-search-ext-link");
        if (extLink) {
          extLink.classList.remove("active");
        }
      }
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (currentMatches.length > 0) {
        // 站内绝对优先：直接在当前页面打开当前选中的文章（默认第 1 篇）
        const target = (selectedIdx >= 0 && selectedIdx < currentMatches.length)
          ? currentMatches[selectedIdx]
          : currentMatches[0];
        if (target && target.url) {
          window.location.href = target.url;
        }
      } else {
        // 站内 0 命中时双次回车机制：第 1 次选中高亮，第 2 次触发全网检索
        const extLink = document.getElementById("qy-search-ext-link");
        if (extLink && extLink.href) {
          if (!extLink.classList.contains("active")) {
            extLink.classList.add("active");
          } else {
            window.open(extLink.href, "_blank");
          }
        }
      }
    } else if (e.key === "Escape") {
      searchDropdown.classList.remove("show");
      this.blur();
    }
  });

  document.addEventListener("keydown", function(e) {
    if (e.key === "/" && document.activeElement !== searchInput && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  document.addEventListener("click", function(e) {
    if (!e.target.closest(".qy-search-container")) {
      searchDropdown.classList.remove("show");
    }
  });
})();
</script>

</body>
</html>
