      settled = true;
      img.onload = null;
      img.onerror = null;
      onFailure();
    }, timeoutMs);

    img.onload = function() {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      onSuccess(img.currentSrc || url);
    };

    img.onerror = function() {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      onFailure();
    };

    img.src = url;
  }

  function pickRandomSeedWallpaper() {
    return SEED_WALLPAPERS[Math.floor(Math.random() * SEED_WALLPAPERS.length)];
  }

  function preloadNextLiveWallpaper() {
    if (isPreloadingWp) return;
    isPreloadingWp = true;
    const candidateUrl = generateLiveWallpaperUrl();
    loadImageWithTimeout(
      candidateUrl,
      10000,
      function(resolvedUrl) {
        isPreloadingWp = false;
        nextPreloadedUrl = sanitizeCssUrl(resolvedUrl) || pickRandomSeedWallpaper();
      },
      function() {
        isPreloadingWp = false;
        nextPreloadedUrl = pickRandomSeedWallpaper();
      }
    );
  }

  function crossfadeToUrl(rawUrl) {
    const cleanUrl = sanitizeCssUrl(rawUrl) || SEED_WALLPAPERS[0];
    const targetLayer = activeLayerIsA ? layerA : layerB;
    const otherLayer = activeLayerIsA ? layerB : layerA;
    targetLayer.style.backgroundImage = `url("${cleanUrl}")`;
    targetLayer.classList.add("active");
    otherLayer.classList.remove("active");
    activeLayerIsA = !activeLayerIsA;
    safeSetLocal("qy_last_wp_url", cleanUrl);
  }

  // 初始壁纸首帧直出，同时静默探活缓存地址（若历史临时 CDN 链接失效则平滑自愈回退）
  const rawSavedUrl = safeGetLocal("qy_last_wp_url", "");
  const initialWpUrl = sanitizeCssUrl(rawSavedUrl) || SEED_WALLPAPERS[0];
  layerA.style.backgroundImage = `url("${initialWpUrl}")`;
  activeLayerIsA = false;

  if (initialWpUrl !== SEED_WALLPAPERS[0]) {
    loadImageWithTimeout(
      initialWpUrl,
      9000,
      function() {},
      function() {
        if (!isPaperMode) {
          crossfadeToUrl(SEED_WALLPAPERS[0]);
        }
      }
    );
  }
  preloadNextLiveWallpaper();

  function nextWallpaper() {
    if (isPaperMode) togglePaperMode(false);
    if (nextPreloadedUrl) {
      const readyUrl = nextPreloadedUrl;
      nextPreloadedUrl = null;
      crossfadeToUrl(readyUrl);
      preloadNextLiveWallpaper();
      return;
    }
    if (isFetchingWp) return;
    isFetchingWp = true;
    if (wpIconEl) wpIconEl.classList.add("fa-spin");

    const liveUrl = generateLiveWallpaperUrl();
    loadImageWithTimeout(
      liveUrl,
      8000,
      function(resolvedUrl) {
        isFetchingWp = false;
        if (wpIconEl) wpIconEl.classList.remove("fa-spin");
        crossfadeToUrl(resolvedUrl);
        preloadNextLiveWallpaper();
      },
      function() {
        isFetchingWp = false;
        if (wpIconEl) wpIconEl.classList.remove("fa-spin");
        crossfadeToUrl(pickRandomSeedWallpaper());
        preloadNextLiveWallpaper();
      }
    );
  }

  function updateAutoRotateState() {
    if (autoRotateTimer) {
      clearInterval(autoRotateTimer);
      autoRotateTimer = null;
    }
    if (isAutoRotate && !isPaperMode) {
      btnAutoWp.classList.add("active");
      autoRotateTimer = setInterval(function() {
        if (document.hidden) return; // 标签页后台隐藏时暂停拉取，零浪费带宽与电量
        nextWallpaper();
      }, 35000);
    } else {
      btnAutoWp.classList.remove("active");
    }
  }

  function togglePaperMode(forceState) {
    isPaperMode = typeof forceState === "boolean" ? forceState : !isPaperMode;
    safeSetLocal("qy_paper_mode", isPaperMode);
    document.body.classList.toggle("qy-paper-mode", isPaperMode);
    btnPaperMode.classList.toggle("active", isPaperMode);
    updateAutoRotateState();
  }

  if (isPaperMode) togglePaperMode(true);
  updateAutoRotateState();

  // 10. 人体工学「下滑自动展开文卷 / 上滑到顶自动收起」状态机
  let modeTransitionLock = false;

  function setPortalMode(zenMode) {
    if (modeTransitionLock) return;
    modeTransitionLock = true;
    setTimeout(() => { modeTransitionLock = false; }, 480);

    if (zenMode) {
      document.body.classList.add("qy-portal-zen");
      document.body.classList.remove("qy-portal-scroll");
      window.scrollTo({ top: 0, behavior: "smooth" });
      dock.classList.remove("qy-dock-scrolled");
    } else {
      document.body.classList.remove("qy-portal-zen");
      document.body.classList.add("qy-portal-scroll");
    }
  }

  if (isHomePage) {
    document.body.classList.add("qy-portal-zen");
  } else {
    document.body.classList.add("qy-inner-page", "qy-portal-scroll");
  }

  if (isHomePage) {
    window.addEventListener("wheel", function(e) {
      if (e.ctrlKey || e.metaKey) return; // 排除触控板双指缩放手势误触发
      const targetEl = getEventTargetElement(e);
      if (targetEl && (targetEl.closest(".qy-peek-drawer") || targetEl.closest(".qy-search-dropdown"))) return;
      const isZen = document.body.classList.contains("qy-portal-zen");
      if (isZen && e.deltaY > 12) {
        setPortalMode(false);
      } else if (!isZen && (window.scrollY || document.documentElement.scrollTop) <= 4 && e.deltaY < -18) {
        setPortalMode(true);
      }
    }, { passive: true });

    let touchStartY = 0;
    let touchIgnoreDrawer = false;
    let touchStartedAtTop = false;

    window.addEventListener("touchstart", function(e) {
      if (e.touches.length !== 1) return;
      const targetEl = getEventTargetElement(e);
      touchIgnoreDrawer = Boolean(targetEl && (targetEl.closest(".qy-peek-drawer") || targetEl.closest(".qy-search-dropdown")));
      touchStartedAtTop = (window.scrollY || document.documentElement.scrollTop) <= 4;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener("touchmove", function(e) {
      if (e.touches.length !== 1 || touchIgnoreDrawer) return;
      const dy = touchStartY - e.touches[0].clientY;
      const isZen = document.body.classList.contains("qy-portal-zen");
      if (isZen && dy > 28) {
        setPortalMode(false);
      } else if (!isZen && touchStartedAtTop && (window.scrollY || document.documentElement.scrollTop) <= 4 && dy < -35) {
        setPortalMode(true);
      }
    }, { passive: true });
  }

  document.getElementById("qy-scroll-hint").addEventListener("click", function() {
    setPortalMode(false);
  });

  // 11. 监听滚动：下滑阅读时，控制坞平滑移至左下角并收缩为「归顶 ↑」单按钮
  let isScrollingToTop = false;
  function handleScroll() {
    const scrollY = window.scrollY || document.documentElement.scrollTop;
    if (isScrollingToTop) {
      if (scrollY <= 10) {
        isScrollingToTop = false;
        dock.classList.remove("qy-dock-scrolled");
      }
      return;
    }
    if (scrollY > 75 || (isHomePage && document.body.classList.contains("qy-portal-scroll") && scrollY > 30)) {
      dock.classList.add("qy-dock-scrolled");
    } else {
      dock.classList.remove("qy-dock-scrolled");
    }
  }
  window.addEventListener("scroll", handleScroll, { passive: true });
  handleScroll();

  // 12. 交互事件绑定
  const peekDrawer = document.getElementById("qy-peek-drawer");
  const quickPeekBtn = document.getElementById("qy-btn-quick-peek");

  // 支持从内页点击「新篇速览」自动切回首屏视界并直接展开速览抽屉
  const urlParams = new URLSearchParams(window.location.search);
  if (isHomePage && (urlParams.get("peek") === "1" || safeGetSession("qy_open_peek", "") === "1")) {
    safeRemoveSession("qy_open_peek");
    if (urlParams.get("peek") === "1") {
      urlParams.delete("peek");
      const remainingQuery = urlParams.toString();
      const cleanUrl = currentPathname + (remainingQuery ? `?${remainingQuery}` : "") + (window.location.hash || "");
      safeReplaceState(cleanUrl);
    }
    setPortalMode(true);
    peekDrawer.classList.add("open");
    quickPeekBtn.classList.add("active");
  }

  quickPeekBtn.addEventListener("click", function() {
    if (!isHomePage) {
      safeSetSession("qy_open_peek", "1");
      window.location.href = "/?peek=1";
      return;
    }
    if (!document.body.classList.contains("qy-portal-zen")) {
      setPortalMode(true);
      peekDrawer.classList.add("open");
      this.classList.add("active");
      return;
    }
    peekDrawer.classList.toggle("open");
    this.classList.toggle("active", peekDrawer.classList.contains("open"));
  });

  document.getElementById("qy-peek-close").addEventListener("click", function() {
    peekDrawer.classList.remove("open");
    quickPeekBtn.classList.remove("active");
  });

  document.getElementById("qy-brand-home").addEventListener("click", function() {
    if (isHomePage) {
      setPortalMode(true);
    } else {
      window.location.href = "/";
    }
  });

  document.getElementById("qy-dock-portal").addEventListener("click", function() {
    if (!isHomePage) {
      window.location.href = "/";
      return;
    }
    const isCurrentlyZen = document.body.classList.contains("qy-portal-zen");
    setPortalMode(!isCurrentlyZen);
  });

  document.getElementById("qy-dock-articles").addEventListener("click", function() {
    if (!isHomePage) {
      window.location.href = "/archives/";
      return;
    }
    setPortalMode(false);
  });

  document.getElementById("qy-dock-next-wp").addEventListener("click", nextWallpaper);

  btnAutoWp.addEventListener("click", function() {
    isAutoRotate = !isAutoRotate;
    safeSetLocal("qy_auto_wp", isAutoRotate);
    updateAutoRotateState();
  });

  btnPaperMode.addEventListener("click", function() {
    togglePaperMode();
  });

  document.getElementById("qy-dock-top").addEventListener("click", function() {
    isScrollingToTop = true;
    dock.classList.remove("qy-dock-scrolled");
    if (isHomePage) {
      setPortalMode(true);
    } else {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    setTimeout(() => { isScrollingToTop = false; }, 600);
  });

  // 13. 站内实时检索框逻辑（支持上下键选择与回车站内优先直达）
  const searchInput = document.getElementById("qy-search-input");
  const searchDropdown = document.getElementById("qy-search-dropdown");
  let currentMatches = [];
  let selectedIdx = -1;

  function updateActiveSearchItem() {
    const items = searchDropdown.querySelectorAll(".qy-search-item");
    items.forEach((item, idx) => {
      if (idx === selectedIdx) {
        item.classList.add("active");
        item.scrollIntoView({ block: "nearest", behavior: "smooth" });
      } else {
        item.classList.remove("active");
      }
    });
  }

  function performSearch() {
    const rawTrimmed = searchInput.value.trim();
    const q = rawTrimmed.toLowerCase();
    if (!q) {
      currentMatches = [];
      selectedIdx = -1;
      searchDropdown.innerHTML = "";
      searchDropdown.classList.remove("show");
      return;
    }

    currentMatches = POST_INDEX.filter(p =>
      (p.title && p.title.toLowerCase().includes(q)) ||
      (p.shortTitle && p.shortTitle.toLowerCase().includes(q)) ||
      (p.summary && p.summary.toLowerCase().includes(q)) ||
      (p.tags && p.tags.some(t => t.toLowerCase().includes(q))) ||
      (p.cat && p.cat.toLowerCase().includes(q))
    );

    selectedIdx = currentMatches.length > 0 ? 0 : -1;

    if (currentMatches.length > 0) {
      searchDropdown.innerHTML = currentMatches.map((m, idx) => `
        <a href="${sanitizeHref(m.url)}" class="qy-search-item ${idx === 0 ? 'active' : ''}" data-idx="${idx}">
          <div class="qy-search-item-top">
            <span class="qy-search-item-cat">${escapeHtml(m.cat)}</span>
            <span class="qy-search-item-title">${escapeHtml(m.shortTitle)}</span>
            <span class="qy-search-item-date">${escapeHtml(m.date)}</span>
          </div>
          <div class="qy-search-item-desc">${escapeHtml(m.summary)}</div>
        </a>
      `).join("");

      // 绑定鼠标划入高亮事件
      searchDropdown.querySelectorAll(".qy-search-item").forEach(item => {
        item.addEventListener("mouseenter", function() {
          const idx = parseInt(this.getAttribute("data-idx"), 10);
          if (!Number.isNaN(idx)) {
            selectedIdx = idx;
            updateActiveSearchItem();
          }
        });
      });
    } else {
      searchDropdown.innerHTML = `
        <div class="qy-search-empty">未在站内寻得匹配文卷</div>
        <a href="https://cn.bing.com/search?q=${encodeURIComponent(rawTrimmed)}" target="_blank" rel="noopener noreferrer" class="qy-search-external-hint" id="qy-search-ext-link">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> 尝试全网检索「${escapeHtml(rawTrimmed)}」
        </a>
      `;
    }
    searchDropdown.classList.add("show");
  }

  searchInput.addEventListener("input", performSearch);
  searchInput.addEventListener("compositionend", performSearch);

  searchInput.addEventListener("keydown", function(e) {
    // 拦截中文/拼音输入法组字或英文选词确认过程中的回车与方向键
    if (e.isComposing || e.keyCode === 229) {
      return;
    }

    if (e.key === "ArrowDown") {
      if (currentMatches.length > 0) {
        e.preventDefault();
        selectedIdx = (selectedIdx + 1) % currentMatches.length;
        updateActiveSearchItem();
      } else {
        const extLink = document.getElementById("qy-search-ext-link");
        if (extLink) {
          extLink.classList.add("active");
        }
      }
    } else if (e.key === "ArrowUp") {
      if (currentMatches.length > 0) {
        e.preventDefault();
        selectedIdx = (selectedIdx - 1 + currentMatches.length) % currentMatches.length;
        updateActiveSearchItem();
      } else {
        const extLink = document.getElementById("qy-search-ext-link");
        if (extLink) {
          extLink.classList.remove("active");
        }
      }
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (currentMatches.length > 0) {
        // 站内绝对优先：直接在当前页面打开当前选中的文章（默认第 1 篇）
        const target = (selectedIdx >= 0 && selectedIdx < currentMatches.length)
          ? currentMatches[selectedIdx]
          : currentMatches[0];
        if (target && target.url) {
          window.location.href = target.url;
        }
      } else {
        // 站内 0 命中时双次回车机制：第 1 次选中高亮，第 2 次触发全网检索
        const extLink = document.getElementById("qy-search-ext-link");
        if (extLink && extLink.href) {
          if (!extLink.classList.contains("active")) {
            extLink.classList.add("active");
          } else {
            window.open(extLink.href, "_blank", "noopener,noreferrer");
          }
        }
      }
    } else if (e.key === "Escape") {
      searchDropdown.classList.remove("show");
      this.blur();
    }
  });

  document.addEventListener("keydown", function(e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    const activeEl = document.activeElement;
    const activeTag = activeEl && activeEl.tagName ? activeEl.tagName.toUpperCase() : "";
    const isEditable = Boolean(activeEl && (activeEl.isContentEditable || ["INPUT", "TEXTAREA", "SELECT"].includes(activeTag)));
    if (e.key === "/" && activeEl !== searchInput && !isEditable) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  document.addEventListener("click", function(e) {
    const targetEl = getEventTargetElement(e);
    if (!targetEl || !targetEl.closest(".qy-search-container")) {
      searchDropdown.classList.remove("show");
    }
  });
})();
</script>

</body>
</html>
