          <span class="qy-peek-title">${post.shortTitle}</span>
          <span class="qy-peek-date">${post.date}</span>
          <span class="qy-peek-action">${activePeekIdx === idx ? '收起纲要 ▴' : '预览纲要 ▾'}</span>
        </div>
        <div class="qy-peek-detail-wrap">
          <div class="qy-peek-detail">
            <p class="qy-peek-summary">${post.summary}</p>
            <div class="qy-peek-footer">
              <div class="qy-peek-tags">
                ${post.tags.map(t => `<span class="qy-mini-tag"># ${t}</span>`).join('')}
              </div>
              <a href="${post.url}" class="qy-peek-readmore">展卷深读全文 →</a>
            </div>
          </div>
        </div>
      </div>
    `).join("");

    peekListEl.querySelectorAll(".qy-peek-row").forEach(row => {
      row.addEventListener("click", function() {
        const item = this.parentElement;
        const idx = parseInt(item.getAttribute("data-idx"), 10);
        activePeekIdx = (activePeekIdx === idx) ? -1 : idx;
        renderPeekList();
      });
    });
  }
  renderPeekList();

  // 8. 改造文章列表卡片：使用 Apple 级丝滑 Grid 折叠动画展开/收起摘要
  function enhanceArticleCards() {
    if (!isHomePage) return;
    const postBlocks = document.querySelectorAll(".main-inner .post-block");
    postBlocks.forEach((block) => {
      const postBody = block.querySelector(".post-body");
      const header = block.querySelector(".post-header");
      if (!postBody || !header || block.dataset.qyEnhanced) return;
      block.dataset.qyEnhanced = "true";

      // 用 Grid 动画容器包裹 postBody，实现丝滑高度过渡
      const gridWrap = document.createElement("div");
      gridWrap.className = "qy-abstract-grid-wrap";
      const gridInner = document.createElement("div");
      gridInner.className = "qy-abstract-grid-inner";

      postBody.parentNode.insertBefore(gridWrap, postBody);
      gridInner.appendChild(postBody);
      gridWrap.appendChild(gridInner);

      const toggleBar = document.createElement("div");
      toggleBar.className = "qy-card-progressive-bar";
      const titleLink = block.querySelector(".post-title-link");
      const postUrl = titleLink ? titleLink.getAttribute("href") : "#";

      toggleBar.innerHTML = `
        <button type="button" class="qy-btn-toggle-abstract">
          <i class="fa-solid fa-eye"></i> 展读核心摘要
        </button>
        <a href="${postUrl}" class="qy-btn-enter-article">
          直入全文深读 <i class="fa-solid fa-arrow-right"></i>
        </a>
      `;

      header.after(toggleBar);

      const toggleBtn = toggleBar.querySelector(".qy-btn-toggle-abstract");
      toggleBtn.addEventListener("click", function() {
        const isExpanded = gridWrap.classList.toggle("expanded");
        this.innerHTML = isExpanded
          ? '<i class="fa-solid fa-eye-slash"></i> 收起摘要'
          : '<i class="fa-solid fa-eye"></i> 展读核心摘要';
      });
    });
  }
  enhanceArticleCards();

  // 9. 壁纸切换与实时轮换引擎
  let currentWpIdx = parseInt(localStorage.getItem("qy_wp_idx") || "0", 10) % WALLPAPERS.length;
  let activeLayerIsA = true;
  let autoRotateTimer = null;
  let isAutoRotate = localStorage.getItem("qy_auto_wp") !== "false";
  let isPaperMode = localStorage.getItem("qy_paper_mode") === "true";

  const layerA = bgContainer.querySelector(".qy-bg-a");
  const layerB = bgContainer.querySelector(".qy-bg-b");
  const btnAutoWp = document.getElementById("qy-dock-auto-wp");
  const btnPaperMode = document.getElementById("qy-dock-paper-mode");

  function applyWallpaper(idx) {
    const wp = WALLPAPERS[idx];
    const img = new Image();
    img.onload = function() {
      const targetLayer = activeLayerIsA ? layerA : layerB;
      const otherLayer = activeLayerIsA ? layerB : layerA;
      targetLayer.style.backgroundImage = `url("${wp.url}")`;
      targetLayer.classList.add("active");
      otherLayer.classList.remove("active");
      activeLayerIsA = !activeLayerIsA;
    };
    img.src = wp.url;
  }

  layerA.style.backgroundImage = `url("${WALLPAPERS[currentWpIdx].url}")`;
  activeLayerIsA = false;

  function nextWallpaper() {
    if (isPaperMode) togglePaperMode(false);
    currentWpIdx = (currentWpIdx + 1) % WALLPAPERS.length;
    localStorage.setItem("qy_wp_idx", String(currentWpIdx));
    applyWallpaper(currentWpIdx);
  }

  function updateAutoRotateState() {
    if (autoRotateTimer) clearInterval(autoRotateTimer);
    if (isAutoRotate && !isPaperMode) {
      btnAutoWp.classList.add("active");
      autoRotateTimer = setInterval(nextWallpaper, 45000);
    } else {
      btnAutoWp.classList.remove("active");
    }
  }

  function togglePaperMode(forceState) {
    isPaperMode = typeof forceState === "boolean" ? forceState : !isPaperMode;
    localStorage.setItem("qy_paper_mode", String(isPaperMode));
    document.body.classList.toggle("qy-paper-mode", isPaperMode);
    btnPaperMode.classList.toggle("active", isPaperMode);
    updateAutoRotateState();
  }

  if (isPaperMode) togglePaperMode(true);
  updateAutoRotateState();

  // 10. 丝滑切换「首屏视界」与「展卷阅文」模式
  const unrollTextEl = document.getElementById("qy-unroll-text");
  const unrollBtn = document.getElementById("qy-btn-expand-posts");

  function setPortalMode(zenMode) {
    if (zenMode) {
      document.body.classList.add("qy-portal-zen");
      document.body.classList.remove("qy-portal-scroll");
      if (unrollTextEl) unrollTextEl.textContent = "展卷阅文";
      if (unrollBtn) unrollBtn.classList.remove("expanded");
      window.scrollTo({ top: 0, behavior: "smooth" });
      dock.classList.remove("qy-dock-scrolled");
    } else {
      document.body.classList.remove("qy-portal-zen");
      document.body.classList.add("qy-portal-scroll");
      if (unrollTextEl) unrollTextEl.textContent = "收卷观景";
      if (unrollBtn) unrollBtn.classList.add("expanded");
    }
  }

  if (isHomePage) {
    setPortalMode(true);
  } else {
    document.body.classList.add("qy-inner-page");
    setPortalMode(false);
  }

  // 11. 监听滚动：下滑阅读时，控制坞平滑移至左下角并收缩为「回到最顶 ↑」单按钮
  let isScrollingToTop = false;
  function handleScroll() {
    if (isScrollingToTop) {
      if (window.scrollY <= 15) {
        isScrollingToTop = false;
        dock.classList.remove("qy-dock-scrolled");
      }
      return;
    }
    const scrollY = window.scrollY || document.documentElement.scrollTop;
    if (scrollY > 90) {
      dock.classList.add("qy-dock-scrolled");
    } else {
      dock.classList.remove("qy-dock-scrolled");
    }
  }
  window.addEventListener("scroll", handleScroll, { passive: true });
  handleScroll();

  // 12. 交互事件绑定
  unrollBtn.addEventListener("click", function() {
    const isCurrentlyZen = document.body.classList.contains("qy-portal-zen");
    if (isCurrentlyZen) {
      setPortalMode(false);
    } else {
      setPortalMode(true);
    }
  });

  const peekDrawer = document.getElementById("qy-peek-drawer");
  const quickPeekBtn = document.getElementById("qy-btn-quick-peek");
  quickPeekBtn.addEventListener("click", function() {
    peekDrawer.classList.toggle("open");
    this.classList.toggle("active", peekDrawer.classList.contains("open"));
  });

  document.getElementById("qy-peek-close").addEventListener("click", function() {
    peekDrawer.classList.remove("open");
    quickPeekBtn.classList.remove("active");
  });

  document.getElementById("qy-brand-home").addEventListener("click", function() {
    if (isHomePage) {
      setPortalMode(true);
    } else {
      window.location.href = "/";
    }
  });

  document.getElementById("qy-dock-portal").addEventListener("click", function() {
    if (!isHomePage) {
      window.location.href = "/";
      return;
    }
    const isCurrentlyZen = document.body.classList.contains("qy-portal-zen");
    setPortalMode(!isCurrentlyZen);
  });

  document.getElementById("qy-dock-articles").addEventListener("click", function() {
    if (!isHomePage) {
      window.location.href = "/archives/";
      return;
    }
    setPortalMode(false);
    setTimeout(() => {
      const mainEl = document.querySelector(".main");
      if (mainEl) mainEl.scrollIntoView({ behavior: "smooth" });
    }, 60);
  });

  document.getElementById("qy-dock-next-wp").addEventListener("click", nextWallpaper);

  btnAutoWp.addEventListener("click", function() {
    isAutoRotate = !isAutoRotate;
    localStorage.setItem("qy_auto_wp", String(isAutoRotate));
    updateAutoRotateState();
  });

  btnPaperMode.addEventListener("click", function() {
    togglePaperMode();
  });

  // 点击最左侧「回到最顶」按钮：平滑回到顶部，同时控制坞丝滑回到正中间
  document.getElementById("qy-dock-top").addEventListener("click", function() {
    isScrollingToTop = true;
    dock.classList.remove("qy-dock-scrolled");
    window.scrollTo({ top: 0, behavior: "smooth" });
    setTimeout(() => { isScrollingToTop = false; }, 700);
  });

  // 诗句点击柔光切换
  let verseIdx = 0;
  const verseBox = document.getElementById("qy-verse-box");
  const verseLine = document.getElementById("qy-verse-line");
  const verseSub = document.getElementById("qy-verse-sub");
  verseBox.addEventListener("click", function() {
    verseBox.classList.add("switching");
    setTimeout(() => {
      verseIdx = (verseIdx + 1) % VERSES.length;
      const v = VERSES[verseIdx];
      verseLine.textContent = `「 ${v.line} 」`;
      verseSub.textContent = v.sub;
      verseBox.classList.remove("switching");
    }, 220);
  });

  // 13. 站内实时检索框逻辑
  const searchInput = document.getElementById("qy-search-input");
  const searchDropdown = document.getElementById("qy-search-dropdown");

  searchInput.addEventListener("input", function() {
    const q = this.value.trim().toLowerCase();
    if (!q) {
      searchDropdown.classList.remove("show");
      return;
    }
    const matches = POST_INDEX.filter(p =>
      p.title.toLowerCase().includes(q) ||
      p.summary.toLowerCase().includes(q) ||
      p.tags.some(t => t.toLowerCase().includes(q)) ||
      p.cat.toLowerCase().includes(q)
    );

    if (matches.length > 0) {
      searchDropdown.innerHTML = matches.map(m => `
        <a href="${m.url}" class="qy-search-item">
          <div class="qy-search-item-top">
            <span class="qy-search-item-cat">${m.cat}</span>
            <span class="qy-search-item-title">${m.shortTitle}</span>
            <span class="qy-search-item-date">${m.date}</span>
          </div>
          <div class="qy-search-item-desc">${m.summary}</div>
        </a>
      `).join("");
    } else {
      searchDropdown.innerHTML = `
        <div class="qy-search-empty">未寻得匹配文卷，按回车键使用必应搜索「${this.value}」</div>
      `;
    }
    searchDropdown.classList.add("show");
  });

  searchInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && this.value.trim()) {
      const q = this.value.trim().toLowerCase();
      const firstMatch = POST_INDEX.find(p =>
        p.title.toLowerCase().includes(q) ||
        p.summary.toLowerCase().includes(q)
      );
      if (firstMatch) {
        window.location.href = firstMatch.url;
      } else {
        window.open(`https://cn.bing.com/search?q=${encodeURIComponent(this.value.trim())}`, "_blank");
      }
    } else if (e.key === "Escape") {
      searchDropdown.classList.remove("show");
      this.blur();
    }
  });

  document.addEventListener("keydown", function(e) {
    if (e.key === "/" && document.activeElement !== searchInput && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  document.addEventListener("click", function(e) {
    if (!e.target.closest(".qy-search-container")) {
      searchDropdown.classList.remove("show");
    }
  });
})();
</script>

</body>
</html>
